<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chartered House of Change — Back soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f7f5f1; color: #1c1c1b;
            font-family: 'Inter', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
        }
        .wrap { max-width: 560px; }
        img { width: 92px; margin-bottom: 38px; }
        .eyebrow {
            font-size: 11px; letter-spacing: .36em; text-transform: uppercase;
            color: #b8965a; margin-bottom: 20px;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif; font-weight: 300;
            font-size: 46px; line-height: 1.1; letter-spacing: .01em; margin-bottom: 24px;
        }
        h1 .italic { font-style: italic; }
        p {
            font-size: 14px; line-height: 1.85; color: #4a4a48;
            max-width: 420px; margin: 0 auto 16px;
        }
        .rule {
            width: 48px; height: 1px; background: #b8965a;
            margin: 34px auto 30px; opacity: .7;
        }
        .est {
            font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #7a7a78;
        }
        .est .gold { color: #b8965a; }
        a { color: #b8965a; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="CHOC logo.png" alt="Chartered House of Change" />
        <p class="eyebrow">One moment</p>
        <h1>We are <span class="italic">rebuilding</span>.</h1>
        <p>The house is being reworked. Back very soon — with something worth the wait.</p>
        <p>For anything in the meantime, write to <a href="mailto:ethan@chocstudio.com">ethan@chocstudio.com</a>.</p>
        <div class="rule"></div>
        <p class="est">Chartered House of Change · Est. <span class="gold">MMXXVI</span></p>
    </div>
</body>
</html>
